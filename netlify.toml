# Configuración de despliegue para Netlify
# Publica el frontend estático y expone el backend como Netlify Functions
# (register/login/mensajes) conectado a una PostgreSQL en la nube.

[build]
  publish = "frontend"
  functions = "netlify/functions"

[build.environment]
  # DATABASE_URL, JWT_SECRET and PORT are only ever read via process.env in
  # server-side code (Netlify Functions / local server.js) and are never
  # written into repo files or the published frontend. Netlify's secrets
  # scanner still flags their configured values as a false positive, so we
  # exempt these keys from scanning per https://ntl.fyi/configure-secrets-scanning
  SECRETS_SCAN_OMIT_KEYS = "DATABASE_URL,JWT_SECRET,PORT"

# Redirigir las rutas /api/* a las funciones serverless
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Redirigir todas las demás rutas a index.html (SPA fallback)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
